<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>ControlBench</title>
  <style>
    body { font-family: sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1rem; }
    label { display: block; margin-top: 0.5rem; }
    input { width: 100%; padding: 0.3rem; box-sizing: border-box; }
    button { margin-top: 0.5rem; padding: 0.3rem 0.8rem; }
    pre { background: #f0f0f0; padding: 0.5rem; white-space: pre-wrap; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 0.3rem; text-align: left; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1rem; }
  </style>
</head>
<body>
  <h1>ControlBench</h1>

  <!-- HTML: nur die Struktur. Das Verhalten steckt in app.js -->
  <h2>Neues Experiment</h2>
  <form id="experiment-form">
    <label>Name <input name="name" required></label>
    <label>Environment <input name="environment" placeholder="Pendulum-v1" required></label>
    <label>Controller <input name="controller" placeholder="SAC, LQR, PID ..." required></label>
    <label>Beschreibung <input name="description"></label>
    <button type="submit">Create Experiment</button>
  </form>

  <h3>Letzte Antwort der API</h3>
  <pre id="response">–</pre>

  <h2>Experimente</h2>
  <ul id="experiment-list"></ul>

  <!-- Wird erst sichtbar, wenn ein Experiment geöffnet wurde -->
  <section id="experiment-detail" hidden>
    <h2 id="detail-title"></h2>
    <p id="detail-info"></p>

    <h3>Runs</h3>
    <table>
      <thead>
        <tr>
          <th>ID</th><th>Seed</th><th>Reward</th><th>Stability [s]</th><th>Recovery [s]</th>
          <th>Steps</th><th>Duration [s]</th><th></th>
        </tr>
      </thead>
      <tbody id="run-table"></tbody>
    </table>

    <h3>Neuer Run</h3>
    <form id="run-form" class="grid">
      <label>Seed <input name="seed" type="number" step="1" required></label>
      <label>Reward <input name="reward" type="number" step="any" required></label>
      <label>Stability Time [s] <input name="stability_time" type="number" step="any"></label>
      <label>Recovery Time [s] <input name="recovery_time" type="number" step="any"></label>
      <label>Num Steps <input name="num_steps" type="number" step="1"></label>
      <label>Duration [s] <input name="duration" type="number" step="any"></label>
      <div><button type="submit">Run speichern</button></div>
    </form>
  </section>

  <script src="app.js"></script>
</body>
</html>
