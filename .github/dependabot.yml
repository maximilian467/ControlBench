# Dependabot: opens pull requests when dependencies have new versions.
# Updates are checked weekly; minor and patch updates are grouped into one PR per ecosystem,
# major updates come as separate PRs because they may contain breaking changes.
version: 2
updates:
  - package-ecosystem: pip
    directories:
      - /backend
      - /experiments
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
